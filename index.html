<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Biblioteca</title>
  <style>
    :root {
      --verde: #285943;
      --verde-claro: #eaf4ee;
      --fundo: #f4f7f5;
      --texto: #24332b;
      --borda: #d8e2dc;
      --vermelho: #b83b42;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background: var(--fundo);
    }
    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 26px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 26px rgba(28, 55, 39, .09);
    }
    .topo { text-align: center; margin-bottom: 26px; }
    .icone { font-size: 38px; }
    h1 { margin: 8px 0; color: var(--verde); font-size: clamp(26px, 5vw, 34px); }
    .subtitulo { margin: 0; color: #64736a; line-height: 1.5; }
    form { display: grid; gap: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--borda);
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }
    input:focus { outline: 3px solid #cce5d5; border-color: var(--verde); }
    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .adicionar { background: var(--verde); color: white; margin-top: 4px; }
    button:focus-visible { outline: 3px solid #8dbda0; outline-offset: 2px; }
    .cabecalho-lista {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 30px 0 14px;
    }
    h2 { margin: 0; font-size: 22px; }
    .contador { background: var(--verde-claro); color: var(--verde); padding: 5px 10px; border-radius: 999px; font-weight: 700; }
    #listaLivros { display: grid; gap: 10px; }
    .vazio {
      padding: 18px;
      text-align: center;
      background: #f8faf8;
      border: 1px dashed var(--borda);
      border-radius: 10px;
      color: #65736a;
    }
    .livro {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      background: white;
    }
    .livro-info { min-width: 0; }
    .livro-titulo { margin: 0 0 5px; font-weight: 700; overflow-wrap: anywhere; }
    .livro-detalhes { margin: 0; color: #65736a; font-size: 14px; overflow-wrap: anywhere; }
    .excluir { flex-shrink: 0; background: #fff0f0; color: var(--vermelho); padding: 9px 12px; }
    .nota { margin-top: 22px; font-size: 13px; color: #718078; line-height: 1.5; }
    @media (max-width: 480px) {
      main { padding: 20px 16px; }
      .livro { align-items: flex-start; }
      .excluir { padding: 8px 10px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topo">
      <div class="icone" aria-hidden="true">📚</div>
      <h1>Minha Biblioteca</h1>
      <p class="subtitulo">Organize seus livros em um só lugar.</p>
    </header>

    <form id="formulario">
      <div>
        <label for="titulo">Título do livro</label>
        <input id="titulo" name="titulo" type="text" placeholder="Ex.: O Pequeno Príncipe" required maxlength="120">
      </div>
      <div>
        <label for="autor">Autor(a)</label>
        <input id="autor" name="autor" type="text" placeholder="Ex.: Antoine de Saint-Exupéry" required maxlength="100">
      </div>
      <div>
        <label for="ano">Ano de publicação</label>
        <input id="ano" name="ano" type="number" placeholder="Ex.: 1943" min="0" max="2100" required>
      </div>
      <button class="adicionar" type="submit">Adicionar livro</button>
    </form>

    <section aria-labelledby="tituloLista">
      <div class="cabecalho-lista">
        <h2 id="tituloLista">Livros cadastrados</h2>
        <span class="contador" id="contador">0 livros</span>
      </div>
      <div id="listaLivros" aria-live="polite">
        <div class="vazio">Nenhum livro cadastrado ainda.</div>
      </div>
    </section>
    <p class="nota">Este é um projeto de estudo. Os livros ficam salvos neste navegador quando o armazenamento local está disponível.</p>
  </main>

  <script>
    const formulario = document.getElementById("formulario");
    const listaLivros = document.getElementById("listaLivros");
    const contador = document.getElementById("contador");
    const CHAVE = "minhaBibliotecaLivros";

    let livros = [];
    try {
      livros = JSON.parse(localStorage.getItem(CHAVE)) || [];
      if (!Array.isArray(livros)) livros = [];
    } catch (erro) {
      livros = [];
    }

    function salvarLivros() {
      try {
        localStorage.setItem(CHAVE, JSON.stringify(livros));
      } catch (erro) {
        // O sistema continua funcionando enquanto a página estiver aberta.
      }
    }

    function mostrarLivros() {
      listaLivros.innerHTML = "";
      contador.textContent = livros.length + (livros.length === 1 ? " livro" : " livros");

      if (livros.length === 0) {
        const vazio = document.createElement("div");
        vazio.className = "vazio";
        vazio.textContent = "Nenhum livro cadastrado ainda.";
        listaLivros.appendChild(vazio);
        return;
      }

      livros.forEach(function(livro, indice) {
        const item = document.createElement("article");
        item.className = "livro";

        const info = document.createElement("div");
        info.className = "livro-info";

        const titulo = document.createElement("p");
        titulo.className = "livro-titulo";
        titulo.textContent = livro.titulo;

        const detalhes = document.createElement("p");
        detalhes.className = "livro-detalhes";
        detalhes.textContent = livro.autor + " · " + livro.ano;

        const excluir = document.createElement("button");
        excluir.type = "button";
        excluir.className = "excluir";
        excluir.textContent = "Excluir";
        excluir.setAttribute("aria-label", "Excluir " + livro.titulo);
        excluir.addEventListener("click", function() {
          livros.splice(indice, 1);
          salvarLivros();
          mostrarLivros();
        });

        info.appendChild(titulo);
        info.appendChild(detalhes);
        item.appendChild(info);
        item.appendChild(excluir);
        listaLivros.appendChild(item);
      });
    }

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();
      const titulo = document.getElementById("titulo").value.trim();
      const autor = document.getElementById("autor").value.trim();
      const ano = document.getElementById("ano").value;

      if (!titulo || !autor || !ano) return;

      livros.push({ titulo: titulo, autor: autor, ano: ano });
      salvarLivros();
      mostrarLivros();
      formulario.reset();
      document.getElementById("titulo").focus();
    });

    mostrarLivros();
  </script>
</body>
</html>
